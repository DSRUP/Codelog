
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&display=swap');

  :root {
    --ink: var(--color-text-primary);
    --ink2: var(--color-text-secondary);
    --ink3: var(--color-text-tertiary);
    --surface: var(--color-background-primary);
    --surface2: var(--color-background-secondary);
    --border: var(--color-border-tertiary);
    --border2: var(--color-border-secondary);
    --mono: 'IBM Plex Mono', monospace;
    --serif: 'Fraunces', Georgia, serif;
  }

  .cj-root { font-family: var(--mono); font-size: 13px; color: var(--ink); padding: 0; max-width: 100%; }

  .cj-header { display: flex; align-items: baseline; justify-content: space-between; padding: 1.5rem 1.5rem 0; border-bottom: 0.5px solid var(--border); padding-bottom: 1rem; }
  .cj-logo { font-family: var(--serif); font-size: 22px; font-weight: 300; font-style: italic; color: var(--ink); letter-spacing: -0.5px; }
  .cj-logo span { font-weight: 500; font-style: normal; }
  .cj-header-actions { display: flex; gap: 8px; }

  .cj-nav { display: flex; gap: 0; border-bottom: 0.5px solid var(--border); padding: 0 1.5rem; overflow-x: auto; }
  .cj-tab { padding: 10px 16px 10px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; color: var(--ink3); white-space: nowrap; transition: all 0.15s; font-family: var(--mono); }
  .cj-tab:hover { color: var(--ink2); }
  .cj-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .cj-tab-add { padding: 10px 12px; color: var(--ink3); cursor: pointer; font-size: 16px; border-bottom: 2px solid transparent; line-height: 1; }
  .cj-tab-add:hover { color: var(--ink); }

  .cj-project { padding: 1.5rem; }
  .cj-project-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; }
  .cj-project-title { font-family: var(--serif); font-size: 20px; font-weight: 300; font-style: italic; color: var(--ink); outline: none; border: none; background: transparent; width: 100%; cursor: text; }
  .cj-project-title:focus { border-bottom: 1px solid var(--border2); }
  .cj-project-meta { font-size: 11px; color: var(--ink3); margin-top: 4px; }

  .cj-blocks { display: flex; flex-direction: column; gap: 12px; }

  .cj-block { border: 0.5px solid var(--border); border-radius: var(--border-radius-lg); overflow: hidden; }
  .cj-block-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface2); border-bottom: 0.5px solid var(--border); }
  .cj-block-type-badge { font-size: 10px; padding: 2px 8px; border-radius: 99px; font-family: var(--mono); font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  .badge-code { background: #AFA9EC; color: #26215C; }
  .badge-desc { background: #9FE1CB; color: #085041; }
  .badge-lesson { background: #FAC775; color: #412402; }
  .cj-block-type-select { font-size: 11px; border: 0.5px solid var(--border2); border-radius: 4px; padding: 2px 6px; background: var(--surface); color: var(--ink2); font-family: var(--mono); cursor: pointer; }
  .cj-block-actions { margin-left: auto; display: flex; gap: 6px; }
  .cj-block-btn { background: none; border: none; cursor: pointer; color: var(--ink3); font-size: 14px; padding: 2px 4px; border-radius: 4px; line-height: 1; }
  .cj-block-btn:hover { color: var(--ink); background: var(--surface); }

  .cj-block-body { position: relative; }

  .cj-code-wrap { background: #1a1a2e; border-radius: 0 0 var(--border-radius-lg) var(--border-radius-lg); position: relative; }
  .cj-code-lang { position: absolute; top: 8px; right: 12px; font-size: 10px; color: #8888aa; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; }
  .cj-code-input { width: 100%; min-height: 100px; background: transparent; border: none; outline: none; color: #e2e8f0; font-family: var(--mono); font-size: 13px; line-height: 1.6; padding: 12px 14px; resize: vertical; box-sizing: border-box; tab-size: 2; }
  .cj-code-input::placeholder { color: #444466; }

  .cj-text-input { width: 100%; min-height: 80px; background: var(--surface); border: none; outline: none; color: var(--ink); font-family: var(--mono); font-size: 13px; line-height: 1.7; padding: 12px 14px; resize: vertical; box-sizing: border-box; }
  .cj-text-input::placeholder { color: var(--ink3); }

  .cj-lesson-input { width: 100%; min-height: 80px; background: #FAEEDA; border: none; outline: none; color: #412402; font-family: var(--mono); font-size: 13px; line-height: 1.7; padding: 12px 14px; resize: vertical; box-sizing: border-box; }
  .cj-lesson-input::placeholder { color: #854F0B; opacity: 0.6; }

  .cj-add-block { display: flex; gap: 8px; margin-top: 8px; }
  .cj-add-btn { flex: 1; padding: 10px; border: 0.5px dashed var(--border2); background: none; color: var(--ink3); cursor: pointer; border-radius: var(--border-radius-md); font-family: var(--mono); font-size: 12px; transition: all 0.15s; }
  .cj-add-btn:hover { background: var(--surface2); color: var(--ink2); border-style: solid; }

  .cj-export-btn { font-size: 12px; padding: 6px 14px; border: 0.5px solid var(--border2); background: none; cursor: pointer; border-radius: var(--border-radius-md); color: var(--ink2); font-family: var(--mono); }
  .cj-export-btn:hover { background: var(--surface2); }

  .cj-empty { text-align: center; padding: 3rem 1rem; color: var(--ink3); font-size: 13px; }
  .cj-empty strong { display: block; font-size: 16px; color: var(--ink2); margin-bottom: 8px; font-family: var(--serif); font-style: italic; font-weight: 300; }

  .cj-delete-project { font-size: 11px; color: var(--color-text-danger); cursor: pointer; padding: 4px 8px; border-radius: 4px; border: none; background: none; font-family: var(--mono); }
  .cj-delete-project:hover { background: var(--color-background-danger); }

  textarea { resize: vertical; }
</style>

<h2 class="sr-only">Coding journal — projects with customisable code, description, and lesson blocks</h2>

<div class="cj-root" id="root"></div>

<script>
const state = {
  projects: [
    {
      id: 1,
      title: "My First HTML Page",
      created: "May 2025",
      blocks: [
        { id: 1, type: "lesson", content: "HTML stands for HyperText Markup Language. It uses tags like <p>, <h1>, and <div> to structure content on a page. Every tag has an opening and a closing version." },
        { id: 2, type: "code", lang: "html", content: `<!DOCTYPE html>\n<html>\n  <head>\n    <title>Hello World</title>\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n    <p>My first webpage.</p>\n  </body>\n</html>` },
        { id: 3, type: "desc", content: "This is the basic skeleton of any HTML page. The <head> contains metadata, the <body> is what you see in the browser. I need to remember to always close my tags!" }
      ]
    },
    {
      id: 2,
      title: "CSS Basics",
      created: "May 2025",
      blocks: [
        { id: 1, type: "lesson", content: "CSS (Cascading Style Sheets) controls how HTML looks — colours, fonts, spacing. You link a CSS file to HTML using a <link> tag in the head." },
        { id: 2, type: "code", lang: "css", content: `body {\n  background: #f5f5f0;\n  font-family: Georgia, serif;\n  max-width: 700px;\n  margin: 0 auto;\n}\n\nh1 {\n  color: #2c2c2a;\n  font-size: 2rem;\n}` },
        { id: 3, type: "desc", content: "The selector (e.g. h1) targets an element, then the curly braces hold the rules. margin: 0 auto is a common trick to centre a block element." }
      ]
    }
  ],
  activeProject: 1,
  nextProjectId: 3,
  nextBlockId: 10
};

function getProject(id) { return state.projects.find(p => p.id === id); }

function badgeClass(type) {
  return type === 'code' ? 'badge-code' : type === 'desc' ? 'badge-desc' : 'badge-lesson';
}
function badgeLabel(type) {
  return type === 'code' ? 'code' : type === 'desc' ? 'description' : 'lesson';
}

function render() {
  const root = document.getElementById('root');
  const proj = getProject(state.activeProject);

  root.innerHTML = `
    <div class="cj-header">
      <div class="cj-logo">code<span>log</span></div>
      <div class="cj-header-actions">
        <button class="cj-export-btn" onclick="exportHTML()"><i class="ti ti-download" aria-hidden="true"></i> export HTML</button>
      </div>
    </div>
    <div class="cj-nav">
      ${state.projects.map(p => `
        <div class="cj-tab ${p.id === state.activeProject ? 'active' : ''}" onclick="switchProject(${p.id})">
          ${escHtml(p.title)}
        </div>
      `).join('')}
      <div class="cj-tab-add" onclick="addProject()" title="New project">+</div>
    </div>
    ${proj ? renderProject(proj) : '<div class="cj-empty"><strong>No project selected</strong></div>'}
  `;
}

function renderProject(proj) {
  return `
    <div class="cj-project">
      <div class="cj-project-header">
        <div style="flex:1">
          <input class="cj-project-title" value="${escHtml(proj.title)}" onblur="updateProjectTitle(${proj.id}, this.value)" placeholder="Project title…" />
          <div class="cj-project-meta">created ${proj.created} &nbsp;·&nbsp; ${proj.blocks.length} block${proj.blocks.length !== 1 ? 's' : ''}</div>
        </div>
        <button class="cj-delete-project" onclick="deleteProject(${proj.id})"><i class="ti ti-trash" aria-hidden="true"></i> delete</button>
      </div>

      <div class="cj-blocks" id="blocks-${proj.id}">
        ${proj.blocks.length === 0 ? `<div class="cj-empty"><strong>Empty project</strong>Add a block below to get started.</div>` : ''}
        ${proj.blocks.map((b, i) => renderBlock(proj.id, b, i)).join('')}
      </div>

      <div class="cj-add-block" style="margin-top:16px">
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'code')"><i class="ti ti-code" aria-hidden="true"></i> + code</button>
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'desc')"><i class="ti ti-align-left" aria-hidden="true"></i> + description</button>
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'lesson')"><i class="ti ti-book" aria-hidden="true"></i> + lesson note</button>
      </div>
    </div>
  `;
}

function renderBlock(projId, block, idx) {
  const bodyHtml = block.type === 'code'
    ? `<div class="cj-code-wrap"><span class="cj-code-lang">${escHtml(block.lang || '')}</span><textarea class="cj-code-input" spellcheck="false" placeholder="// write your code here…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea></div>`
    : block.type === 'lesson'
    ? `<textarea class="cj-lesson-input" placeholder="Write your lesson notes, concepts, or key takeaways here…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea>`
    : `<textarea class="cj-text-input" placeholder="Describe what this code does, what you learned, or what's next…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea>`;

  const langSelector = block.type === 'code' ? `
    <select class="cj-block-type-select" style="margin-left:4px" onchange="updateBlockLang(${projId}, ${block.id}, this.value)">
      ${['html','css','javascript','python','sql','bash'].map(l => `<option ${block.lang===l?'selected':''}>${l}</option>`).join('')}
    </select>` : '';

  const typeSelector = `
    <select class="cj-block-type-select" onchange="changeBlockType(${projId}, ${block.id}, this.value)">
      <option value="code" ${block.type==='code'?'selected':''}>code</option>
      <option value="desc" ${block.type==='desc'?'selected':''}>description</option>
      <option value="lesson" ${block.type==='lesson'?'selected':''}>lesson</option>
    </select>`;

  return `
    <div class="cj-block" id="block-${projId}-${block.id}">
      <div class="cj-block-header">
        <span class="cj-block-type-badge ${badgeClass(block.type)}">${badgeLabel(block.type)}</span>
        ${typeSelector}
        ${langSelector}
        <div class="cj-block-actions">
          ${idx > 0 ? `<button class="cj-block-btn" title="Move up" onclick="moveBlock(${projId}, ${block.id}, -1)"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>` : ''}
          ${idx < getProject(projId).blocks.length - 1 ? `<button class="cj-block-btn" title="Move down" onclick="moveBlock(${projId}, ${block.id}, 1)"><i class="ti ti-arrow-down" aria-hidden="true"></i></button>` : ''}
          <button class="cj-block-btn" title="Delete block" onclick="deleteBlock(${projId}, ${block.id})"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="cj-block-body">${bodyHtml}</div>
    </div>
  `;
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchProject(id) { state.activeProject = id; render(); }

function addProject() {
  const id = state.nextProjectId++;
  state.projects.push({ id, title: "New project", created: new Date().toLocaleDateString('en-GB', {month:'short', year:'numeric'}), blocks: [] });
  state.activeProject = id;
  render();
}

function deleteProject(id) {
  if (state.projects.length === 1) { alert("You need at least one project."); return; }
  state.projects = state.projects.filter(p => p.id !== id);
  state.activeProject = state.projects[0].id;
  render();
}

function updateProjectTitle(projId, val) {
  const p = getProject(projId); if (p) p.title = val; render();
}

function addBlock(projId, type) {
  const p = getProject(projId); if (!p) return;
  p.blocks.push({ id: state.nextBlockId++, type, lang: 'javascript', content: '' });
  render();
}

function deleteBlock(projId, blockId) {
  const p = getProject(projId); if (!p) return;
  p.blocks = p.blocks.filter(b => b.id !== blockId);
  render();
}

function changeBlockType(projId, blockId, type) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.type = type; render();
}

function updateBlockContent(projId, blockId, val) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.content = val;
}

function updateBlockLang(projId, blockId, lang) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.lang = lang; render();
}

function moveBlock(projId, blockId, dir) {
  const p = getProject(projId); if (!p) return;
  const idx = p.blocks.findIndex(b => b.id === blockId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= p.blocks.length) return;
  const tmp = p.blocks[idx]; p.blocks[idx] = p.blocks[newIdx]; p.blocks[newIdx] = tmp;
  render();
}

function exportHTML() {
  const html = generateExportHTML();
  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'codelog.html';
  a.click();
}

function generateExportHTML() {
  const projectsHTML = state.projects.map(proj => {
    const blocksHTML = proj.blocks.map(b => {
      if (b.type === 'code') return `<div class="block code"><div class="badge code-badge">code · ${escHtml(b.lang)}</div><pre><code>${escHtml(b.content)}</code></pre></div>`;
      if (b.type === 'lesson') return `<div class="block lesson"><div class="badge lesson-badge">lesson note</div><p>${escHtml(b.content).replace(/\n/g,'<br>')}</p></div>`;
      return `<div class="block desc"><div class="badge desc-badge">description</div><p>${escHtml(b.content).replace(/\n/g,'<br>')}</p></div>`;
    }).join('\n');
    return `<section class="project" id="proj-${proj.id}">\n<h2>${escHtml(proj.title)} <span class="meta">${proj.created}</span></h2>\n${blocksHTML}\n</section>`;
  }).join('\n\n');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codelog</title>
<style>
  body { font-family: 'IBM Plex Mono', monospace; background: #f5f5f0; color: #2c2c2a; max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Fraunces:ital,wght@1,300&display=swap');
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-style: italic; font-size: 2rem; margin-bottom: 2rem; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-style: italic; font-size: 1.4rem; border-bottom: 1px solid #d3d1c7; padding-bottom: 8px; }
  .meta { font-size: 0.75rem; color: #888; font-family: monospace; font-style: normal; margin-left: 12px; }
  .project { margin-bottom: 3rem; }
  .block { border-radius: 10px; margin-bottom: 14px; overflow: hidden; border: 1px solid #d3d1c7; }
  .badge { font-size: 11px; padding: 5px 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .code-badge { background: #AFA9EC; color: #26215C; }
  .desc-badge { background: #9FE1CB; color: #085041; }
  .lesson-badge { background: #FAC775; color: #412402; }
  .block.code pre { background: #1a1a2e; color: #e2e8f0; padding: 14px 16px; margin: 0; overflow-x: auto; font-size: 13px; line-height: 1.6; }
  .block.desc p, .block.lesson p { padding: 12px 16px; margin: 0; font-size: 13px; line-height: 1.7; }
  .block.lesson p { background: #FAEEDA; color: #412402; }
  nav { margin-bottom: 2rem; }
  nav a { margin-right: 16px; color: #533; font-size: 13px; }
</style>
</head>
<body>
<h1>codelog</h1>
<nav>${state.projects.map(p => `<a href="#proj-${p.id}">${escHtml(p.title)}</a>`).join('')}</nav>
${projectsHTML}
</body>
</html>`;
}

render();
</script>
