<h2 class="sr-only">Coding journal — projects with customisable code, description, and lesson blocks</h2>

<div class="cj-root" id="root"></div>

<script>
const defaultState = {
  projects: [
    {
      id: 1,
      title: "My First HTML Page",
      created: "May 2025",
      blocks: [
        { id: 1, type: "lesson", content: "HTML stands for HyperText Markup Language. It uses tags like <p>, <h1>, and <div> to structure content on a page. Every tag has an opening and a closing version." },
        { id: 2, type: "code", lang: "html", content: `<!DOCTYPE html>\n<html>\n  <head>\n    <title>Hello World</title>\n  </head>\n  <body>\n    <h1>Hello, world!</h1>\n    <p>My first webpage.</p>\n  </body>\n</html>` },
        { id: 3, type: "desc", content: "This is the basic skeleton of any HTML page. The <head> contains metadata, the <body> is what you see in the browser. I need to remember to always close my tags!" }
      ]
    },
    {
      id: 2,
      title: "CSS Basics",
      created: "May 2025",
      blocks: [
        { id: 1, type: "lesson", content: "CSS (Cascading Style Sheets) controls how HTML looks — colours, fonts, spacing. You link a CSS file to HTML using a <link> tag in the head." },
        { id: 2, type: "code", lang: "css", content: `body {\n  background: #f5f5f0;\n  font-family: Georgia, serif;\n  max-width: 700px;\n  margin: 0 auto;\n}\n\nh1 {\n  color: #2c2c2a;\n  font-size: 2rem;\n}` },
        { id: 3, type: "desc", content: "The selector (e.g. h1) targets an element, then the curly braces hold the rules. margin: 0 auto is a common trick to centre a block element." }
      ]
    }
  ],
  activeProject: 1,
  searchQuery: '',
  quickAccessMode: false,
  nextProjectId: 3,
  nextBlockId: 10
};

const saved = localStorage.getItem('codelog-state');

const state = saved
  ? JSON.parse(saved)
  : defaultState;

function saveState() {
  localStorage.setItem('codelog-state', JSON.stringify(state));
}



const accentPalette = ['#9FE1CB', '#AFA9EC', '#FAC775', '#F2A6A6', '#9BC7F5', '#C9E27D', '#E7B7F3', '#F0B27A'];

function getProjectAccent(projId) {
  const index = Math.abs(Number(projId || 1) - 1) % accentPalette.length;
  return accentPalette[index];
}

function setAccent(projId) {
  const root = document.querySelector('.cj-root');
  if (!root) return;
  const p = getProject(projId);
  const accent = p && p.accent ? p.accent : getProjectAccent(projId);
  root.style.setProperty('--accent', accent);
  root.style.setProperty('--accent-soft', accent + '33');
}

function cycleProjectAccent(projId) {
  const p = getProject(projId);
  if (!p) return;

  const current = p.accent || getProjectAccent(projId);
  const idx = accentPalette.indexOf(current);
  p.accent = accentPalette[(idx + 1) % accentPalette.length];

  saveState();
  render();
}

function getAccentForProject(proj) {
  return proj.accent || getProjectAccent(proj.id);
}

function renderMarkdown(text) {
  return text
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/gim, '<em>$1</em>')
    .replace(/`(.*?)`/gim, '<code>$1</code>')
    .replace(/^- (.*$)/gim, '<li>$1</li>')
    .replace(/\n/g, '<br>');
}


function getProject(id) { return state.projects.find(p => p.id === id); }

function badgeClass(type) {
  if (type === 'code') return 'badge-code';
  if (type === 'desc') return 'badge-desc';
  if (type === 'divider') return 'badge-desc';
  return 'badge-lesson';
}
function badgeLabel(type) {
  if (type === 'code') return 'code';
  if (type === 'desc') return 'description';
  if (type === 'divider') return 'section';
  return 'lesson';
}



function openFocusMode(projId, blockId) {
  closeFocusMode();

  const p = getProject(projId);
  if (!p) return;
  const b = p.blocks.find(block => block.id === blockId);
  if (!b) return;

  const overlay = document.createElement('div');
  overlay.className = 'cj-focus-overlay';
  overlay.id = 'cj-focus-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', 'Focused block view');

  overlay.innerHTML = `
    <div class="cj-focus-card" onclick="event.stopPropagation()">
      <div class="cj-focus-header">
        <div class="cj-focus-title">${escHtml(p.title)} · ${badgeLabel(b.type)}</div>
        <div class="cj-focus-help">Press Esc or click outside to close</div>
        <button class="cj-focus-close-x" onclick="closeFocusMode()" aria-label="Close focus mode">×</button>
      </div>
      <div class="cj-focus-body">
        ${renderBlock(projId, b, p.blocks.findIndex(block => block.id === blockId))}
      </div>
    </div>
  `;

  overlay.addEventListener('click', function() {
    closeFocusMode();
  });

  document.body.classList.add('cj-modal-open');
  document.body.appendChild(overlay);

  const firstClose = overlay.querySelector('.cj-focus-close-x');
  if (firstClose) firstClose.focus();
}

function closeFocusMode() {
  const overlay = document.getElementById('cj-focus-overlay');
  if (overlay) overlay.remove();
  document.body.classList.remove('cj-modal-open');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeFocusMode();
});



function normaliseSearchText(value) {
  return String(value || '').toLowerCase();
}

function makeSnippet(text, query) {
  const raw = String(text || '');
  const q = String(query || '').trim();
  if (!q) return escHtml(raw.slice(0, 220));

  const lower = raw.toLowerCase();
  const idx = lower.indexOf(q.toLowerCase());

  if (idx === -1) return escHtml(raw.slice(0, 220));

  const start = Math.max(0, idx - 70);
  const end = Math.min(raw.length, idx + q.length + 120);
  const before = escHtml(raw.slice(start, idx));
  const match = escHtml(raw.slice(idx, idx + q.length));
  const after = escHtml(raw.slice(idx + q.length, end));

  return `${start > 0 ? '…' : ''}${before}<span class="cj-mark">${match}</span>${after}${end < raw.length ? '…' : ''}`;
}

function getSearchResults() {
  const query = String(state.searchQuery || '').trim();
  if (!query) return [];

  const q = query.toLowerCase();
  const results = [];

  state.projects.forEach(project => {
    if (normaliseSearchText(project.title).includes(q)) {
      results.push({
        type: 'project',
        projectId: project.id,
        title: project.title,
        meta: 'Project title',
        snippet: project.title
      });
    }

    if (project.curriculum) {
      project.curriculum.forEach(item => {
        if (normaliseSearchText(item.title).includes(q)) {
          results.push({
            type: 'curriculum',
            projectId: project.id,
            title: item.title,
            meta: `${project.title} · curriculum module${item.done ? ' · complete' : ''}`,
            snippet: item.title
          });
        }
      });
    }

    if (project.blocks) {
      project.blocks.forEach(block => {
        const blockText = `${block.content || ''} ${block.lang || ''} ${badgeLabel(block.type)}`;
        if (normaliseSearchText(blockText).includes(q)) {
          results.push({
            type: 'block',
            projectId: project.id,
            blockId: block.id,
            title: block.type === 'divider' ? (block.content || 'Section divider') : badgeLabel(block.type),
            meta: `${project.title} · ${badgeLabel(block.type)}${block.lang ? ' · ' + block.lang : ''}${block.quickAccess ? ' · quick access' : ''}`,
            snippet: block.content || ''
          });
        }
      });
    }
  });

  return results;
}

function renderSearchResults() {
  const results = getSearchResults();
  const query = String(state.searchQuery || '').trim();

  return `
    <div class="cj-search-results">
      <div class="cj-search-summary">${results.length} result${results.length === 1 ? '' : 's'} for “${escHtml(query)}”</div>
      ${results.length === 0
        ? `<div class="cj-empty"><strong>No matches yet</strong>Try searching a project name, module, section, code, note, or language.</div>`
        : `<div class="cj-search-result-list">
            ${results.map(result => `
              <div class="cj-search-card" onclick="goToSearchResult(${result.projectId}, ${result.blockId || 'null'})">
                <div class="cj-search-card-title">${escHtml(result.title)}</div>
                <div class="cj-search-card-meta">${escHtml(result.meta)}</div>
                <div class="cj-search-snippet">${makeSnippet(result.snippet, query)}</div>
              </div>
            `).join('')}
          </div>`
      }
    </div>
  `;
}

function goToSearchResult(projectId, blockId) {
  state.activeProject = projectId;
  state.quickAccessMode = false;
  const targetBlockId = blockId;

  state.searchQuery = '';
  render();

  if (targetBlockId) {
    setTimeout(() => {
      const el = document.getElementById(`block-${projectId}-${targetBlockId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        el.style.boxShadow = '0 0 0 4px var(--accent-soft), 0 16px 36px rgba(0,0,0,0.12)';
        setTimeout(() => {
          el.style.boxShadow = '';
        }, 1600);
      }
    }, 50);
  }
}


function updateSearch(query) {
  state.searchQuery = query.toLowerCase();
  loadTheme();
render();
}

function toggleTheme() {
  document.body.classList.toggle('dark-theme');
  localStorage.setItem('codelog-theme', document.body.classList.contains('dark-theme') ? 'dark' : 'light');
}

function loadTheme() {
  const theme = localStorage.getItem('codelog-theme');
  if (theme === 'dark') {
    document.body.classList.add('dark-theme');
  }
}

function toggleQuickAccess(projId, blockId) {
  const p = getProject(projId);
  const b = p.blocks.find(b => b.id === blockId);

  if (!b.quickAccess) {
    b.quickAccess = true;
  } else {
    b.quickAccess = false;
  }

  saveState();
  render();
}

function showQuickAccess() {
  state.quickAccessMode = !state.quickAccessMode;
  render();
}


function render() {
  const root = document.getElementById('root');

  const proj = getProject(state.activeProject);
  if (proj) setAccent(proj.id);

  if (state.quickAccessMode) {
    setAccent(state.activeProject);
    const quickBlocks = state.projects.flatMap(p =>
      p.blocks.filter(b => b.quickAccess).map(b => ({...b, projId: p.id}))
    );

    root.innerHTML = `
      <div class="cj-header">
        <div class="cj-logo">quick<span>access</span></div>
        <div class="cj-header-actions">
          <button class="cj-theme-btn" onclick="showQuickAccess()">← back to journal</button>
        </div>
      </div>

      <div class="cj-project">
        ${quickBlocks.map((b, i) => renderBlock(b.projId, b, i)).join('')}
      </div>
    `;

    return;
  }


  if (String(state.searchQuery || '').trim()) {
    root.innerHTML = `
      <div class="cj-header">
        <div class="cj-logo">search<span>results</span></div>
        <div class="cj-header-actions">
          <input class="cj-search" placeholder="search everything..." value="${escHtml(state.searchQuery || '')}" oninput="updateSearch(this.value)" onkeydown="event.stopPropagation()" autofocus />
          <button class="cj-theme-btn" onclick="updateSearch('')">clear</button>
          <button class="cj-theme-btn" onclick="toggleTheme()">theme</button>
        </div>
      </div>
      ${renderSearchResults()}
    `;
    return;
  }

  root.innerHTML = `
    <div class="cj-header">
      <div class="cj-logo">code<span>log</span></div>
      <div class="cj-header-actions">
        <input class="cj-search" placeholder="search everything..." value="${escHtml(state.searchQuery || '')}" oninput="updateSearch(this.value)" onkeydown="event.stopPropagation()" />
        <button class="cj-theme-btn" onclick="toggleTheme()">theme</button>
        <button class="cj-theme-btn" onclick="showQuickAccess()">quick access</button>
        <button class="cj-export-btn" onclick="exportHTML()"><i class="ti ti-download" aria-hidden="true"></i> export backup</button>
      </div>
    </div>
    <div class="cj-nav">
      ${state.projects.map(p => `
        <div class="cj-tab ${p.id === state.activeProject ? 'active' : ''}" onclick="switchProject(${p.id})">
          <span class="cj-accent-dot" style="background:${getAccentForProject(p)}"></span>${escHtml(p.title)}
        </div>
      `).join('')}
      <div class="cj-tab-add" onclick="addProject()" title="New project">+</div>
    </div>
    ${proj ? renderProject(proj) : '<div class="cj-empty"><strong>No project selected</strong></div>'}
  `;
}



function getCurriculumProgress(proj) {
  const items = proj.curriculum || [];
  if (items.length === 0) return 0;
  const done = items.filter(item => item.done).length;
  return Math.round((done / items.length) * 100);
}

function renderCurriculum(proj) {
  if (!proj.curriculum || proj.curriculum.length === 0) {
    return `
      <div class="cj-curriculum">
        <div class="cj-curriculum-top">
          <div>
            <div class="cj-curriculum-title">curriculum map</div>
            <div class="cj-curriculum-subtitle">Break this project into modules, tick them off, and track your progress.</div>
          </div>
          <div class="cj-progress-wrap">
            <div class="cj-progress-number">0%</div>
            <div class="cj-progress-track"><div class="cj-progress-fill" style="width:0%"></div></div>
          </div>
        </div>
        <div class="cj-curriculum-actions">
          <button class="cj-small-btn" onclick="addCurriculumStarter(${proj.id})">+ add starter curriculum</button>
          <button class="cj-small-btn" onclick="addCurriculumItem(${proj.id})">+ blank module</button>
        </div>
      </div>
    `;
  }

  const progress = getCurriculumProgress(proj);

  return `
    <div class="cj-curriculum">
      <div class="cj-curriculum-top">
        <div>
          <div class="cj-curriculum-title">curriculum map</div>
          <div class="cj-curriculum-subtitle">${proj.curriculum.filter(i => i.done).length} of ${proj.curriculum.length} modules complete</div>
        </div>
        <div class="cj-progress-wrap">
          <div class="cj-progress-number">${progress}%</div>
          <div class="cj-progress-track"><div class="cj-progress-fill" style="width:${progress}%"></div></div>
        </div>
      </div>

      <div class="cj-module-list">
        ${proj.curriculum.map((item, idx) => `
          <div class="cj-module-item ${item.done ? 'done' : ''}">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleCurriculumItem(${proj.id}, ${item.id})" />
            <input class="cj-module-name" value="${escHtml(item.title)}" onblur="updateCurriculumItem(${proj.id}, ${item.id}, this.value)" placeholder="Module title..." />
            <div class="cj-module-actions">
              ${idx > 0 ? `<button class="cj-block-btn" onclick="moveCurriculumItem(${proj.id}, ${item.id}, -1)">↑</button>` : ''}
              ${idx < proj.curriculum.length - 1 ? `<button class="cj-block-btn" onclick="moveCurriculumItem(${proj.id}, ${item.id}, 1)">↓</button>` : ''}
              <button class="cj-block-btn" onclick="deleteCurriculumItem(${proj.id}, ${item.id})">×</button>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="cj-curriculum-actions">
        <button class="cj-small-btn" onclick="addCurriculumItem(${proj.id})">+ module</button>
        <button class="cj-small-btn" onclick="clearCompletedCurriculum(${proj.id})">clear completed</button>
      </div>
    </div>
  `;
}

function ensureCurriculum(proj) {
  if (!proj.curriculum) proj.curriculum = [];
}

function addCurriculumStarter(projId) {
  const p = getProject(projId);
  if (!p) return;
  ensureCurriculum(p);

  const starter = [
    'Understand the core concept',
    'Build a small working example',
    'Write notes in your own words',
    'Practise with a variation',
    'Review and mark confident'
  ];

  starter.forEach(title => {
    p.curriculum.push({
      id: state.nextBlockId++,
      title,
      done: false
    });
  });

  saveState();
  render();
}

function addCurriculumItem(projId) {
  const p = getProject(projId);
  if (!p) return;
  ensureCurriculum(p);

  p.curriculum.push({
    id: state.nextBlockId++,
    title: 'New module',
    done: false
  });

  saveState();
  render();
}

function updateCurriculumItem(projId, itemId, title) {
  const p = getProject(projId);
  if (!p || !p.curriculum) return;
  const item = p.curriculum.find(i => i.id === itemId);
  if (!item) return;

  item.title = title;
  saveState();
  render();
}

function toggleCurriculumItem(projId, itemId) {
  const p = getProject(projId);
  if (!p || !p.curriculum) return;
  const item = p.curriculum.find(i => i.id === itemId);
  if (!item) return;

  item.done = !item.done;
  saveState();
  render();
}

function deleteCurriculumItem(projId, itemId) {
  const p = getProject(projId);
  if (!p || !p.curriculum) return;

  p.curriculum = p.curriculum.filter(i => i.id !== itemId);
  saveState();
  render();
}

function moveCurriculumItem(projId, itemId, dir) {
  const p = getProject(projId);
  if (!p || !p.curriculum) return;

  const idx = p.curriculum.findIndex(i => i.id === itemId);
  const newIdx = idx + dir;

  if (newIdx < 0 || newIdx >= p.curriculum.length) return;

  const tmp = p.curriculum[idx];
  p.curriculum[idx] = p.curriculum[newIdx];
  p.curriculum[newIdx] = tmp;

  saveState();
  render();
}

function clearCompletedCurriculum(projId) {
  const p = getProject(projId);
  if (!p || !p.curriculum) return;

  p.curriculum = p.curriculum.filter(i => !i.done);
  saveState();
  render();
}


function renderBlocks(proj) {
  let html = '';
  
  for (let i = 0; i < proj.blocks.length; i++) {
    const block = proj.blocks[i];

    if (block.row) {
      const partner = proj.blocks[i + 1];

      if (partner && partner.row === block.row) {
        html += `
          <div class="cj-row">
            ${renderBlock(proj.id, block, i)}
            ${renderBlock(proj.id, partner, i + 1)}
          </div>
        `;
        i++;
      } else {
        html += renderBlock(proj.id, block, i);
      }
    } else {
      html += renderBlock(proj.id, block, i);
    }
  }

  return html;
}

function renderProject(proj) {
  return `
    <div class="cj-project">
      <div class="cj-project-header">
        <div style="flex:1">
          <input class="cj-project-title" value="${escHtml(proj.title)}" onblur="updateProjectTitle(${proj.id}, this.value)" placeholder="Project title…" />
          <div class="cj-project-meta">created ${proj.created} &nbsp;·&nbsp; ${proj.blocks.length} block${proj.blocks.length !== 1 ? 's' : ''}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="cj-small-btn" onclick="cycleProjectAccent(${proj.id})"><span class="cj-accent-dot" style="background:${getAccentForProject(proj)}"></span>accent</button>
          <button class="cj-delete-project" onclick="deleteProject(${proj.id})"><i class="ti ti-trash" aria-hidden="true"></i> delete</button>
        </div>
      </div>

      ${renderCurriculum(proj)}

      <div class="cj-blocks" id="blocks-${proj.id}">
        ${proj.blocks.length === 0 ? `<div class="cj-empty"><strong>Empty project</strong>Add a block below to get started.</div>` : ''}
        ${renderBlocks(proj)}
      </div>

      <div class="cj-add-block" style="margin-top:16px">
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'code')"><i class="ti ti-code" aria-hidden="true"></i> + code</button>
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'desc')"><i class="ti ti-align-left" aria-hidden="true"></i> + description</button>
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'lesson')"><i class="ti ti-book" aria-hidden="true"></i> + lesson note</button>
        <button class="cj-add-btn" onclick="addBlock(${proj.id}, 'divider')">+ section divider</button>
      </div>

      <div class="cj-add-block">
        <button class="cj-add-btn" onclick="addSideBySide(${proj.id}, 'code', 'desc')">+ code + description</button>
        <button class="cj-add-btn" onclick="addSideBySide(${proj.id}, 'lesson', 'code')">+ lesson + code</button>
        <button class="cj-add-btn" onclick="addSideBySide(${proj.id}, 'desc', 'lesson')">+ description + lesson</button>
      </div>
    </div>
  `;
}

function renderBlock(projId, block, idx) {
  if (block.type === 'divider') {
    const p = getProject(projId);
    return `
      <div class="cj-divider-block" id="block-${projId}-${block.id}">
        <div class="cj-divider-line">
          <input class="cj-divider-title" value="${escHtml(block.content || 'New section')}" onblur="updateBlockContent(${projId}, ${block.id}, this.value)" placeholder="Section title..." />
        </div>
        <div class="cj-divider-actions">
          ${idx > 0 ? `<button class="cj-block-btn" title="Move up" onclick="moveBlock(${projId}, ${block.id}, -1)">↑</button>` : ''}
          ${idx < p.blocks.length - 1 ? `<button class="cj-block-btn" title="Move down" onclick="moveBlock(${projId}, ${block.id}, 1)">↓</button>` : ''}
          <button class="cj-block-btn" title="Delete section" onclick="deleteBlock(${projId}, ${block.id})">×</button>
        </div>
      </div>
    `;
  }

  const bodyHtml = block.type === 'code'
    ? `<div class="cj-code-wrap"><span class="cj-code-lang">${escHtml(block.lang || '')}</span><textarea class="cj-code-input" spellcheck="false" placeholder="// write your code here…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea></div>`
    : block.type === 'lesson'
    ? `<textarea class="cj-lesson-input" placeholder="Write your lesson notes, concepts, or key takeaways here…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea>`
    : `<textarea class="cj-text-input" placeholder="Describe what this code does, what you learned, or what's next…" onblur="updateBlockContent(${projId}, ${block.id}, this.value)">${escHtml(block.content)}</textarea>`;

  const langSelector = block.type === 'code' ? `
    <select class="cj-block-type-select" style="margin-left:4px" onchange="updateBlockLang(${projId}, ${block.id}, this.value)">
      ${['html','css','javascript','python','sql','bash'].map(l => `<option ${block.lang===l?'selected':''}>${l}</option>`).join('')}
    </select>` : '';

  const typeSelector = `
    <select class="cj-block-type-select" onchange="changeBlockType(${projId}, ${block.id}, this.value)">
      <option value="code" ${block.type==='code'?'selected':''}>code</option>
      <option value="desc" ${block.type==='desc'?'selected':''}>description</option>
      <option value="lesson" ${block.type==='lesson'?'selected':''}>lesson</option>
      <option value="divider" ${block.type==='divider'?'selected':''}>section divider</option>
    </select>`;

  return `
    <div class="cj-block" id="block-${projId}-${block.id}">
      <div class="cj-block-header">
        <span class="cj-block-type-badge ${badgeClass(block.type)}">${badgeLabel(block.type)}</span>
        ${typeSelector}
        ${langSelector}
        <div class="cj-block-actions">
          ${idx > 0 ? `<button class="cj-block-btn" title="Move up" onclick="moveBlock(${projId}, ${block.id}, -1)"><i class="ti ti-arrow-up" aria-hidden="true"></i></button>` : ''}
          ${idx < getProject(projId).blocks.length - 1 ? `<button class="cj-block-btn" title="Move down" onclick="moveBlock(${projId}, ${block.id}, 1)"><i class="ti ti-arrow-down" aria-hidden="true"></i></button>` : ''}
          <button class="cj-block-btn" title="Open focus mode" onclick="openFocusMode(${projId}, ${block.id})">⛶</button>
          <button class="cj-block-btn" title="Quick access" onclick="toggleQuickAccess(${projId}, ${block.id})">★</button>
          <button class="cj-block-btn" title="Delete block" onclick="deleteBlock(${projId}, ${block.id})"><i class="ti ti-x" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="cj-block-body">${bodyHtml}</div>
    </div>
  `;
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchProject(id) { state.activeProject = id; render(); }

function addProject() {
  const id = state.nextProjectId++;
  state.projects.push({ id, title: "New project", created: new Date().toLocaleDateString('en-GB', {month:'short', year:'numeric'}), blocks: [] });
  state.activeProject = id;
  saveState();
  render();
}

function deleteProject(id) {
  if (state.projects.length === 1) { alert("You need at least one project."); return; }
  state.projects = state.projects.filter(p => p.id !== id);
  state.activeProject = state.projects[0].id;
  saveState();
  render();
}

function updateProjectTitle(projId, val) {
  const p = getProject(projId); if (p) p.title = val;
  saveState();
  render();
}


function addSideBySide(projId, type1, type2) {
  const p = getProject(projId);
  if (!p) return;

  const rowId = Date.now();

  p.blocks.push({
    id: state.nextBlockId++,
    type: type1,
    lang: 'javascript',
    content: '',
    row: rowId
  });

  p.blocks.push({
    id: state.nextBlockId++,
    type: type2,
    lang: 'javascript',
    content: '',
    row: rowId
  });

  saveState();
  render();
}

function addBlock(projId, type) {
  const p = getProject(projId); if (!p) return;
  p.blocks.push({ 
    id: state.nextBlockId++, 
    type, 
    lang: 'javascript', 
    content: type === 'divider' ? 'New section' : '' 
  });
  saveState();
  render();
}

function deleteBlock(projId, blockId) {
  const p = getProject(projId); if (!p) return;
  p.blocks = p.blocks.filter(b => b.id !== blockId);
  saveState();
  render();
}

function changeBlockType(projId, blockId, type) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.type = type;
  saveState();
  render();
}

function updateBlockContent(projId, blockId, val) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.content = val;
  saveState();
}

function updateBlockLang(projId, blockId, lang) {
  const p = getProject(projId); if (!p) return;
  const b = p.blocks.find(b => b.id === blockId); if (!b) return;
  b.lang = lang;
  saveState();
  render();
}

function moveBlock(projId, blockId, dir) {
  const p = getProject(projId); if (!p) return;
  const idx = p.blocks.findIndex(b => b.id === blockId);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= p.blocks.length) return;
  const tmp = p.blocks[idx]; p.blocks[idx] = p.blocks[newIdx]; p.blocks[newIdx] = tmp;
  saveState();
  render();
}

function exportHTML() {
  const html = generateExportHTML();
  const blob = new Blob([html], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'codelog.html';
  a.click();
}

function generateExportHTML() {
  const projectsHTML = state.projects.map(proj => {
    const blocksHTML = proj.blocks.map(b => {
      if (b.type === 'divider') return `<div class="section-divider"><span>${escHtml(b.content || 'Section')}</span></div>`;
      if (b.type === 'code') return `<div class="block code"><div class="badge code-badge">code · ${escHtml(b.lang)}</div><pre><code>${escHtml(b.content)}</code></pre></div>`;
      if (b.type === 'lesson') return `<div class="block lesson"><div class="badge lesson-badge">lesson note</div><p>${escHtml(b.content).replace(/\n/g,'<br>')}</p></div>`;
      return `<div class="block desc"><div class="badge desc-badge">description</div><p>${escHtml(b.content).replace(/\n/g,'<br>')}</p></div>`;
    }).join('\n');
    const curriculumHTML = proj.curriculum && proj.curriculum.length
      ? `<div class="export-curriculum"><strong>Curriculum progress: ${getCurriculumProgress(proj)}%</strong><ul>${proj.curriculum.map(item => `<li>${item.done ? '✓' : '○'} ${escHtml(item.title)}</li>`).join('')}</ul></div>`
      : '';

    return `<section class="project" id="proj-${proj.id}">\n<h2>${escHtml(proj.title)} <span class="meta">${proj.created}</span></h2>\n${curriculumHTML}\n${blocksHTML}\n</section>`;
  }).join('\n\n');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codelog</title>
<style>
  body { font-family: 'IBM Plex Mono', monospace; background: #f5f5f0; color: #2c2c2a; max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem; }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=Fraunces:ital,wght@1,300&display=swap');
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-style: italic; font-size: 2rem; margin-bottom: 2rem; }
  h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 300; font-style: italic; font-size: 1.4rem; border-bottom: 1px solid #d3d1c7; padding-bottom: 8px; }
  .meta { font-size: 0.75rem; color: #888; font-family: monospace; font-style: normal; margin-left: 12px; }
  .project { margin-bottom: 3rem; }
  .block { border-radius: 10px; margin-bottom: 14px; overflow: hidden; border: 1px solid #d3d1c7; }
  .badge { font-size: 11px; padding: 5px 12px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; }
  .code-badge { background: #AFA9EC; color: #26215C; }
  .desc-badge { background: #9FE1CB; color: #085041; }
  .lesson-badge { background: #FAC775; color: #412402; }
  .block.code pre { background: #1a1a2e; color: #e2e8f0; padding: 14px 16px; margin: 0; overflow-x: auto; font-size: 13px; line-height: 1.6; }
  .block.desc p, .block.lesson p { padding: 12px 16px; margin: 0; font-size: 13px; line-height: 1.7; }
  .block.lesson p { background: #FAEEDA; color: #412402; }
  .section-divider { display: flex; align-items: center; gap: 12px; margin: 2rem 0 1rem; font-family: 'Fraunces', Georgia, serif; font-size: 1.25rem; font-style: italic; color: #2c2c2a; }
  .section-divider::before, .section-divider::after { content: ""; height: 2px; background: #aaa; flex: 1; }
  .section-divider span { white-space: nowrap; }
  .export-curriculum { border: 1px solid #d3d1c7; border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; background: #fff; }
  .export-curriculum ul { margin-bottom: 0; line-height: 1.8; }
  nav { margin-bottom: 2rem; }
  nav a { margin-right: 16px; color: #533; font-size: 13px; }
</style>
</head>
<body>
<h1>codelog</h1>
<nav>${state.projects.map(p => `<a href="#proj-${p.id}">${escHtml(p.title)}</a>`).join('')}</nav>
${projectsHTML}
</body>
</html>`;
}

render();
</script>
